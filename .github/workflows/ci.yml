name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify SKILL.md pins current CLI version exactly
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          CLI_VERSION=$(node -p "require('./cli/package.json').version")
          FILES="skills/microsoft-build/SKILL.md cli/README.md AGENTS.md"

          # Count every `npx -y @microsoft/events-cli...` invocation regardless of pin.
          TOTAL=$(grep -cE "npx -y @microsoft/events-cli" $FILES 2>/dev/null | awk -F: '{ sum += $2 } END { print sum+0 }')

          # Count invocations pinned to the exact current version.
          # The trailing pattern ensures we match @0.3.0 but NOT @0.3.0-rc1 or @0.3.05.
          GOOD=$(grep -cE "npx -y @microsoft/events-cli@${CLI_VERSION//./\\.}([^0-9.]|$)" $FILES 2>/dev/null | awk -F: '{ sum += $2 } END { print sum+0 }')

          BAD=$((TOTAL - GOOD))

          if [ "$BAD" -gt 0 ]; then
            echo "::error::Found $BAD non-canonical 'npx -y @microsoft/events-cli' invocation(s); expected exact pin '@${CLI_VERSION}'."
            # Surface the offending lines for the contributor.
            grep -nE "npx -y @microsoft/events-cli" $FILES | \
              grep -vE "npx -y @microsoft/events-cli@${CLI_VERSION//./\\.}([^0-9.]|$)" || true
            exit 1
          fi

          if [ "$GOOD" -eq 0 ]; then
            echo "::error::No reference to 'npx -y @microsoft/events-cli@${CLI_VERSION}' found."
            exit 1
          fi
          echo "OK: $GOOD canonical pin(s) at @${CLI_VERSION}; 0 non-canonical invocations."

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test CLI commands with cached fixture
        run: npm run smoke:fixture

      - name: Smoke test live catalog
        if: github.event_name != 'pull_request'
        run: npm run smoke:live
